project: "Rotkeeper"
author: "draw me an elephant"
title: "Rotkeeper Config"
description: "Minimal valid config for rendering tests"
default_template: "theme-spooky-dark.html"
input_format: "markdown"

# Opt-in Oliver `render --from markdown` extensions (#402). Each name maps to
# its same-named CLI flag and is exercised by the preflight smoke render, so
# an unknown name or a renderer that predates a flag fails loudly. Adopted
# per #403-#405: callouts (> [!type] blocks incl. +/- fold markers), comments
# (Obsidian %% %% annotations, stripped from output), highlights (==text== ->
# <mark>, emoji-prefixed -> .highlight-<color>). Deliberately NOT adopted:
# math (#406, no typesetting story yet — renders raw TeX in a styled span)
# and embeds (#407, CLI emits dead placeholder spans without a resolver).
# The `obsidian` preset is rejected by policy: it bundles task-lists and
# footnotes across the documented literal-render boundary.
markdown_extensions:
  - callouts
  - comments
  - highlights

# Config-driven theme registry (#252): mode names -> template files.
# `default` selects the per-site theme and wins over the legacy
# `default_template` key above; per-page `template:` frontmatter still wins
# over both. rk_resolve_default_template (rc-utils.sh) validates that every
# registered entry exists under bones/templates at load time.
theme_registry:
  default: "theme-spooky-dark.html"
  spooky-dark: "theme-spooky-dark.html"
  spooky-dark-xhtml: "theme-spooky-dark-xhtml.html"
  spooky-light: "theme-spooky-light.html"
  dark: "theme-dark.html"
  light: "theme-light.html"
  kawaii: "theme-kawaii.html"
  overgrown: "theme-overgrown.html"
  phosphor: "theme-phosphor.html"
  brutal: "theme-brutal.html"
  textpattern: "theme-textpattern.html"
  necropolis: "theme-necropolis.html"
  daisy: "theme-daisy.html"
  daisy-vanilla: "theme-daisy-vanilla.html"
  flash: "theme-flash.html"
  pride: "theme-pride.html"

# Site navigation rendered into the theme's <site-nav></site-nav>
# placeholder (#244). Items are site-root-relative targets
# (e.g. "docs/index.html"); the adapter resolves them to the current
# page's depth via $assets_root$ and fills the raw-HTML placeholder
# post-wrap (every non-literal oliver token html-escapes). The optional
# `class` per item lets a theme reuse its own nav styling (textpattern
# uses `txp-nav-link`). Omit this block (or leave items empty) and the
# placeholder stays untouched.
navigation:
  label: "Primary Navigation"
  items:
    - label: "Home"
      target: "index.html"
      class: "txp-nav-link"
    - label: "Textile Guide"
      target: "docs/textile-guide.html"
      class: "txp-nav-link"
    - label: "Textile Showcase"
      target: "docs/textile-showcase.html"
      class: "txp-nav-link"
    - label: "Oliver Contract"
      target: "docs/oliver-contract.html"
      class: "txp-nav-link"
    - label: "Workflow"
      target: "docs/workflow.html"
      class: "txp-nav-link"
    - label: "Docs Index"
      target: "docs/index.html"
      class: "txp-nav-link"
