name: Rotkeeper CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  # Manual dispatch: run the full matrix on any branch (useful while stacked
  # PRs target non-main bases, which the pull_request filter skips).
  workflow_dispatch:
    inputs:
      publish_walkthrough:
        description: "Run the fresh-clone Help walkthrough and publish the approved docs-334-walkthrough preview"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Zig 0.16.0
        # Oliver (the renderer) requires Zig 0.16.0 to build from source, and
        # neither runner ships it. Tarball + SHA-256 come from ziglang.org's
        # official index, selected per runner OS/architecture. The full
        # tarball goes under /usr/local/lib with a /usr/local/bin symlink:
        # `zig build` needs its installation tree (lib/) next to the real
        # binary, and /usr/local/bin is on PATH (and sudo's secure_path on
        # Linux) so the setup.sh step can find it.
        run: |
          set -euo pipefail
          sudo mkdir -p /usr/local/lib /usr/local/bin
          case "$RUNNER_OS" in
            Linux)
              ZIG=zig-x86_64-linux-0.16.0
              SUM="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  /tmp/zig.tar.xz"
              wget -q "https://ziglang.org/download/0.16.0/${ZIG}.tar.xz" -O /tmp/zig.tar.xz
              echo "$SUM" | sha256sum -c -
              ;;
            macOS)
              if [ "$(uname -m)" = "arm64" ]; then
                ZIG=zig-aarch64-macos-0.16.0
                SUM="b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489  /tmp/zig.tar.xz"
              else
                ZIG=zig-x86_64-macos-0.16.0
                SUM="0387557ed1877bc6a2e1802c8391953baddba76081876301c522f52977b52ba7  /tmp/zig.tar.xz"
              fi
              curl -sL "https://ziglang.org/download/0.16.0/${ZIG}.tar.xz" -o /tmp/zig.tar.xz
              echo "$SUM" | shasum -a 256 -c -
              ;;
            *)
              echo "Unsupported runner OS: $RUNNER_OS" >&2
              exit 1
              ;;
          esac
          sudo tar -xJf /tmp/zig.tar.xz -C /usr/local/lib
          sudo ln -sf "/usr/local/lib/${ZIG}/zig" /usr/local/bin/zig
          zig version

      - name: Install bash 5 and ShellCheck (macOS)
        # macOS /bin/bash is 3.2 and Rotkeeper requires Bash 4+ (e.g. ${var,,}).
        # Homebrew's bash lands in $(brew --prefix)/bin, which the harness
        # steps below prepend to PATH. ubuntu-latest already ships ShellCheck.
        if: runner.os == 'macOS'
        run: |
          brew install bash shellcheck coreutils
          brew --prefix

      - name: Setup Environment
        # This triggers the same deterministic setup used locally; with Zig on
        # PATH it clones drawmeanelephant/oliver, checks out the pinned
        # OLIVER_PIN commit from scripts/setup.sh (never unpinned main), builds
        # it, and installs the binary to /usr/local/bin/oliver.
        # Linux runs under sudo (apt + secure_path); macOS must NOT — Homebrew
        # refuses to run as root, and the script's internal $SUDO handles the
        # privileged installs (passwordless on GitHub runners).
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew_prefix="$(brew --prefix)"
            export PATH="$brew_prefix/bin:$PATH"
            bash scripts/setup.sh
          else
            sudo bash scripts/setup.sh
          fi

      - name: Verify Oliver Renderer
        # oliver --help exits non-zero (provisional CLI), so prove the binary
        # works with a real stdin -> stdout render instead.
        run: |
          command -v oliver
          printf '# CI smoke\n' | oliver render --from markdown | grep -q '<h1>CI smoke</h1>'
          echo "oliver renders markdown"

      - name: Lint with ShellCheck
        run: |
          echo "Running ShellCheck on dispatcher..."
          shellcheck rotkeeper.sh
          echo "Running ShellCheck on Rotatui companion..."
          shellcheck rotatui.sh
          echo "Running ShellCheck on all ritual scripts..."
          find bones/scripts -name "rc-*.sh" -exec shellcheck {} +

      - name: Run Full Test Harness
        # The harness runs the hermetic adapter + golden passes and, because a
        # real oliver binary is on PATH, the real-Oliver renderer smoke and
        # CommonMark contract corpus on every layout pass. RK_STRICT=1 turns
        # the harness's real-binary skip paths (missing oliver, missing
        # contract corpus) into hard failures, so a green run always proves
        # real Oliver was exercised. macOS must run under Homebrew bash 5,
        # never the system bash 3.2.
        env:
          RK_STRICT: "1"
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew_prefix="$(brew --prefix)"
            export PATH="$brew_prefix/bin:$brew_prefix/opt/coreutils/libexec/gnubin:$PATH"
          fi
          bash --version | head -1
          bash rotkeeper.sh test

      - name: Enforce Help and Docs site gates
        # Same build and assertions as the full harness and deploy workflow.
        # Help + Docs page checks; whole-site local links; audited docs CSS;
        # DIP sidecars/authored guides and generated dispatcher coverage.
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew_prefix="$(brew --prefix)"
            export PATH="$brew_prefix/bin:$brew_prefix/opt/coreutils/libexec/gnubin:$PATH"
          fi
          bash rotkeeper.sh test --site

      - name: Theme Accessibility Gate
        # Static WCAG AA contrast / focus-state / narrow-viewport audit over
        # every theme stylesheet. Fails the build when a theme regresses or a
        # new theme lands without passing (issue #258).
        run: |
          bash rotkeeper.sh a11y

      - name: Save checked Help for the manual walkthrough
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.publish_walkthrough
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: walkthrough-instructions
          path: output/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  test:
    name: test
    needs: test-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Matrix status check aggregator
        run: echo "All matrix test jobs completed successfully."

  walkthrough:
    name: Fresh-clone Help walkthrough and approved preview
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.publish_walkthrough && github.repository == 'drawmeanelephant/rotkeeper'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: rotkeeper-docs-334-walkthrough
      cancel-in-progress: false
    steps:
      - name: Download the rendered Help instructions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: walkthrough-instructions
          path: ${{ runner.temp }}/rendered-help

      - name: Read Help and clone the selected commit afresh
        env:
          WALKTHROUGH_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          IFS=$'\n\t'
          python3 - <<'PY'
          import os
          from html.parser import HTMLParser
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "rendered-help"
          class Text(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []
              def handle_data(self, data):
                  self.parts.append(data)
          for page in ("help/index.html", "docs/onboarding.html", "docs/workflow.html", "docs/publishing.html"):
              parser = Text()
              parser.feed((root / page).read_text())
              text = "".join(parser.parts)
              print(f"=== Rendered instructions: {page} ===\n{text}")
          PY
          git clone --branch "$WALKTHROUGH_REF" "https://github.com/$GITHUB_REPOSITORY.git" "$RUNNER_TEMP/rotkeeper-walkthrough"
          cd "$RUNNER_TEMP/rotkeeper-walkthrough"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e output
          test ! -e bones/book-reports
          test ! -e bones/reports/autopsy-help.md
          test ! -e bones/manifest.txt
          git status --short
          printf 'Fresh remote clone at %s, no generated site, book, help report, or manifest.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Install the documented tools, including the pinned fallback compiler
        run: |
          set -euo pipefail
          IFS=$'\n\t'
          sudo apt-get update
          sudo apt-get install -y shellcheck coreutils
          curl -fsSL --max-time 120 https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          printf '%s  %s\n' 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00 "$RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          sudo mkdir -p /usr/local/lib /usr/local/bin
          sudo tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C /usr/local/lib
          sudo ln -sf /usr/local/lib/zig-x86_64-linux-0.16.0/zig /usr/local/bin/zig
          cd "$RUNNER_TEMP/rotkeeper-walkthrough"
          bash scripts/setup.sh
          bash rotkeeper.sh preflight
          oliver --version

      - name: Follow init, new, render, checks, and pack from Help
        run: |
          set -euo pipefail
          IFS=$'\n\t'
          cd "$RUNNER_TEMP/rotkeeper-walkthrough"
          bash rotkeeper.sh init --with-sample
          bash rotkeeper.sh new my-page.md --title "My page" --description "My first Rotkeeper page."
          bash rotkeeper.sh new walkthrough.md --subdir journal --title "Walkthrough"
          bash rotkeeper.sh render
          bash rotkeeper.sh links
          bash rotkeeper.sh a11y
          bash rotkeeper.sh status
          bash rotkeeper.sh pack
          python3 - <<'PY'
          import hashlib
          import json
          import tarfile
          from pathlib import Path
          for name in ("index.html", "my-page.html", "journal/walkthrough.html", "assets/css/theme-spooky-dark.css"):
              assert (Path("output") / name).stat().st_size > 0, name
          archives = list(Path("bones/archive").glob("tomb-*.tar.gz"))
          assert len(archives) == 1, archives
          archive = archives[0]
          with tarfile.open(archive) as packed:
              metadata = json.load(packed.extractfile("metadata.json"))
              assert metadata["mode"] == "default", metadata
              for name in ("output/index.html", "output/my-page.html", "output/journal/walkthrough.html",
                           "output/assets/css/theme-spooky-dark.css"):
                  assert packed.extractfile(name).read() == Path(name).read_bytes(), name
          exports = list(Path("bones/archive").glob("tomb-export-*.json"))
          assert len(exports) == 1 and isinstance(json.loads(exports[0].read_text()), list), exports
          print(f"Archive verified: {archive.name}; SHA-256 {hashlib.sha256(archive.read_bytes()).hexdigest()}")
          print(f"Metadata: {metadata}; valid source export: {exports[0].name}")
          PY
          gzip -t bones/archive/tomb-*.tar.gz
          bash rotkeeper.sh test --site
          printf 'Install → init → new → render → pack passed. Archive bytes, metadata, gzip, source JSON, links, themes, and site gates verified.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Set up the documented upload tool runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Upload only the approved non-production preview
        id: publish
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.146.0"
          packageManager: npm
          workingDirectory: ${{ runner.temp }}/rotkeeper-walkthrough
          command: pages deploy output --project-name=rotkeeper --branch=docs-334-walkthrough

      - name: Verify public preview delivery against uploaded bytes
        env:
          DEPLOYMENT_URL: ${{ steps.publish.outputs.deployment-url }}
        run: |
          set -euo pipefail
          IFS=$'\n\t'
          cd "$RUNNER_TEMP/rotkeeper-walkthrough"
          python3 - <<'PY'
          import hashlib
          import os
          import time
          from pathlib import Path
          from urllib.error import URLError
          from urllib.parse import urlsplit
          from urllib.request import Request, urlopen
          host = os.environ["DEPLOYMENT_URL"].rstrip("/")
          parsed = urlsplit(host)
          assert parsed.scheme == "https" and parsed.hostname.endswith(".rotkeeper.pages.dev"), host
          assert parsed.hostname != "rotkeeper.pages.dev", "Must verify a preview, not production"
          files = ("index.html", "my-page.html", "journal/walkthrough.html", "assets/css/theme-spooky-dark.css")
          for attempt in range(12):
              try:
                  evidence = []
                  for name in files:
                      expected = (Path("output") / name).read_bytes()
                      route = "/" if name == "index.html" else "/" + name
                      with urlopen(Request(host + route, headers={"Cache-Control": "no-cache"}), timeout=20) as response:
                          actual = response.read()
                          assert response.status == 200 and actual == expected, name
                      evidence.append(f"{route}: HTTP 200, {len(actual)} bytes, SHA-256 {hashlib.sha256(actual).hexdigest()}")
                  break
              except (URLError, OSError, AssertionError) as error:
                  if attempt == 11:
                      raise
                  print(f"Waiting for preview delivery: {error}")
                  time.sleep(10)
          report = f"Publication verified: {host}\n" + "\n".join(evidence) + "\nNo production, DNS, or host settings changed.\n"
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(report)
          PY

