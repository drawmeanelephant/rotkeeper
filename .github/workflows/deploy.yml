name: Publish Rotkeeper help

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: rotkeeper-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check help site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Zig 0.16.0
        # Keep the same source-build fallback as ci.yml and scripts/setup.sh.
        shell: bash
        run: |
          set -euo pipefail
          IFS=$'\n\t'
          curl -fsSL --max-time 120 \
            https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz \
            -o "$RUNNER_TEMP/zig.tar.xz"
          printf '%s  %s\n' \
            70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00 \
            "$RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          sudo mkdir -p /usr/local/lib /usr/local/bin
          sudo tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C /usr/local/lib
          sudo ln -sf /usr/local/lib/zig-x86_64-linux-0.16.0/zig /usr/local/bin/zig
          zig version

      - name: Install the pinned Oliver renderer and site tools
        run: sudo bash scripts/setup.sh

      - name: Build and enforce Help and Docs site gates
        shell: bash
        run: |
          set -euo pipefail
          IFS=$'\n\t'
          bash rotkeeper.sh test --site
          test -s output/index.html
          test -s output/docs/publishing.html

      - name: Save the checked site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rotkeeper-site
          path: output/
          if-no-files-found: error
          # Rendered reference pages include docs/.github/ and dotfile pages.
          # This uploads only the generated site, never checkout credentials.
          include-hidden-files: true
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'drawmeanelephant/rotkeeper'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the checked site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rotkeeper-site
          path: output/

      - name: Set up Node for the deployment tool only
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Publish the production deployment
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.146.0"
          packageManager: npm
          command: pages deploy output --project-name=rotkeeper --branch=main

      - name: Verify both public hostnames serve the uploaded bytes
        shell: bash
        run: |
          set -euo pipefail
          IFS=$'\n\t'
          python3 - <<'PY'
          import time
          from pathlib import Path
          from urllib.error import URLError
          from urllib.request import Request, urlopen

          hosts = ("https://rot.filed.fyi", "https://rotkeeper.pages.dev")
          files = ("index.html", "docs/publishing.html")
          for attempt in range(12):
              try:
                  for file in files:
                      expected = (Path("output") / file).read_bytes()
                      route = "/" if file == "index.html" else "/docs/publishing"
                      for host in hosts:
                          request = Request(
                              host + route,
                              headers={"Cache-Control": "no-cache", "User-Agent": "rotkeeper-deploy-check"},
                          )
                          with urlopen(request, timeout=20) as response:
                              if response.status != 200 or response.read() != expected:
                                  raise ValueError(f"{host}{route}: not serving the uploaded bytes")
                  print("Both hostnames return HTTP 200 and match the uploaded home and publishing pages.")
                  break
              except (URLError, OSError, ValueError) as error:
                  if attempt == 11:
                      raise SystemExit(f"Public deployment verification failed: {error}")
                  print(f"Waiting for production deployment: {error}")
                  time.sleep(10)
          PY
